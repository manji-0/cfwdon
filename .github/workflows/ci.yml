name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Do not add path filters on web-ui/server. The aggregator `ci` requires both
# jobs to report success; a skipped job is not success, so path skips would
# fail the required `CI / ci` check on docs-only or crate-only PRs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  web-ui:
    name: web-ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Worker script unit tests
        working-directory: ${{ github.workspace }}
        run: node --test scripts/lib/*.test.mjs

  server:
    name: server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # When NIXBUILD_TOKEN is set, offload Nix builds for the dev shell (for
      # example wrangler on a cache.nixos.org miss) to nixbuild.net instead of
      # compiling on the GitHub runner. See docs/operations/nixbuild-net.md.
      # GitHub Actions does not allow secrets in `if:` expressions, so detect the
      # token in a prior step and branch on that output instead.
      - name: Detect nixbuild token
        id: nixbuild
        env:
          NIXBUILD_TOKEN: ${{ secrets.NIXBUILD_TOKEN }}
        run: |
          if [ -n "${NIXBUILD_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Configure nixbuild.net
        if: steps.nixbuild.outputs.enabled == 'true'
        uses: nixbuild/nixbuild-action@v25
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
          generate_summary_for: job

      # Load the flake dev shell (Rust toolchain from rust-toolchain.toml,
      # wrangler, worker-build, wasm-bindgen-cli, just, ...) into later steps.
      - name: Enter Nix dev shell
        uses: nicknovitski/nix-develop@v1

      - name: Show toolchain
        run: |
          rustc -vV
          cargo --version
          wrangler --version
          worker-build --version

      # Keep shared-key ci-server-v2. Do not restore the poison prefix
      # v0-rust-ci-server-Linux-x64-e96c609d.
      - name: Cache cargo build
        uses: swatinem/rust-cache@v2
        with:
          shared-key: ci-server-v2
          cache-workspace-crates: true
          cache-on-failure: true
          workspaces: |
            . -> target

      - name: Run server CI
        run: just ci-server

      # wasm clippy stays in ci-server (PRs included). worker-build --release
      # dry-run is ~3 min and only needs to catch wrangler.toml / wasm-opt
      # breakage on main, or on-demand via workflow_dispatch. Do not run
      # wrangler deploy --dry-run on pull_request.
      - name: Wrangler dry-run
        if: github.event_name != 'pull_request'
        run: just ci-wrangler-dry-run

  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - web-ui
      - server
    if: always()
    steps:
      - name: Require web-ui and server jobs
        run: |
          test "${{ needs.web-ui.result }}" = "success"
          test "${{ needs.server.result }}" = "success"
