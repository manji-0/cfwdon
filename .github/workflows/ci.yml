name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      RUSTUP_HOME: ${{ github.workspace }}/.devbox/.rustup
      CARGO_HOME: ${{ github.workspace }}/.devbox/.cargo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            .devbox/.rustup
            .devbox/.cargo
          key: rust-${{ runner.os }}-${{ hashFiles('devbox.json', 'devbox.lock', 'rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.15.0
        with:
          project-path: .
          enable-cache: true
          devbox-version: "0.17.5"
          refresh-cli: false

      - name: Cache cargo build
        uses: swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: Run CI
        run: devbox run ci
