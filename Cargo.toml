[workspace]
members = [
    "crates/cfwdon-core",
    "crates/cfwdon-domain",
    "crates/cfwdon-models",
    "crates/cfwdon-worker",
]
resolver = "2"

[workspace.package]
version = "0.10.1"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
cfwdon-core = { path = "crates/cfwdon-core" }
cfwdon-domain = { path = "crates/cfwdon-domain" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
stateright = "0.31.0"
thiserror = "2.0.18"
worker = { version = "0.8.5", features = ["d1", "queue"] }
worker-macros = "0.8.5"

[workspace.lints.clippy]
too_many_arguments = "allow"
items_after_test_module = "allow"
large_enum_variant = "allow"

[profile.dev]
# Line tables keep panics/backtraces useful while cutting debuginfo size,
# link time, and CI cache volume.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
