[workspace]
members = [
    "crates/cfwdon-core",
    "crates/cfwdon-domain",
    "crates/cfwdon-models",
    "crates/cfwdon-worker",
]
resolver = "2"

[workspace.package]
version = "0.4.2"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
cfwdon-core = { path = "crates/cfwdon-core" }
cfwdon-domain = { path = "crates/cfwdon-domain" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
stateright = "0.31.0"
thiserror = "2.0.18"
worker = { version = "0.7.4", features = ["d1", "queue"] }
worker-macros = "0.7.4"
