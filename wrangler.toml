name = "cfwdon"
main = "crates/cfwdon-worker/build/index.js"
compatibility_date = "2026-04-13"

[placement]
mode = "smart"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1

[build]
command = "WASM_BINDGEN_BIN=\"$HOME/.cargo/bin/wasm-bindgen\" worker-build --release crates/cfwdon-worker"

[triggers]
crons = ["17 * * * *"]

[vars]
INSTANCE_DOMAIN = "fedi.manji.app"
INSTANCE_NAME = "cfwdon"
INSTANCE_DESCRIPTION = "Cloudflare Workers 上で動く、個人向けの Mastodon 互換サーバです。"
SOURCE_URL = "https://github.com/manji-0/cfwdon"
INSTANCE_LANGUAGES = "ja,en"
CONTACT_EMAIL = "admin@manji.app"
INSTANCE_THUMBNAIL_URL = "https://media.fedi.manji.app/site/thumbnail.png"
MEDIA_PUBLIC_BASE_URL = "https://media.fedi.manji.app"

INSTANCE_EXTENDED_DESCRIPTION_HTML = """
<p><strong>cfwdon</strong>（fedi.manji.app）は、Cloudflare Workers / D1 / R2 上で動く個人運用の Mastodon 互換サーバです。</p>
<p>ActivityPub で他の Fediverse サーバと連合し、WebFinger・NodeInfo・標準的な Mastodon API を通じてクライアントやリモートサーバから発見・利用できます。</p>
<p>登録は Auth0 経由です。問い合わせは <a href="mailto:admin@manji.app">admin@manji.app</a> まで。ソースコードは <a href="https://github.com/manji-0/cfwdon">GitHub</a> で公開しています。</p>
"""
INSTANCE_EXTENDED_DESCRIPTION_UPDATED_AT = "2026-07-23T00:00:00Z"

PRIVACY_POLICY_HTML = """
<p>本サーバ（fedi.manji.app / cfwdon）は個人運用の Fediverse インスタンスです。運用者は投稿・プロフィール・メディア・連合に必要なメタデータを、サービス提供のために処理します。</p>
<p><strong>取得する情報</strong>には、アカウント識別子と認証に用いるメールアドレス、投稿本文、メディア、フォロー関係、およびアクセス・連合処理に伴う技術ログが含まれます。</p>
<p><strong>第三者提供</strong>は、ActivityPub 連合やクライアント連携などサービス動作に必要な範囲、または法令に基づく場合に限ります。広告目的の販売は行いません。</p>
<p><strong>保管</strong>は Cloudflare（Workers / D1 / R2 等）上で行い、運用上不要になったデータは合理的な期間内に削除または匿名化します。問い合わせは <a href="mailto:admin@manji.app">admin@manji.app</a> まで。</p>
"""
PRIVACY_POLICY_UPDATED_AT = "2026-07-23T00:00:00Z"

TERMS_OF_SERVICE_HTML = """
<p>fedi.manji.app（cfwdon）を利用することで、本利用規約に同意したものとみなします。</p>
<p><strong>利用</strong>は個人の良識あるコミュニケーションを前提とします。違法行為、嫌がらせ、スパム、他者の権利侵害、サーバや連合先への過度な負荷、マルウェア配布などは禁止します。</p>
<p><strong>コンテンツ</strong>の責任は投稿者にあります。運用者は規約違反や安全性上の理由で、投稿・アカウント・連合関係を制限・削除できます。本サーバはベストエフォートで提供され、無停止や完全性を保証しません。</p>
<p>規約は予告なく更新することがあります。重要な変更がある場合はインスタンス説明などで周知します。連絡先は <a href="mailto:admin@manji.app">admin@manji.app</a> です。</p>
"""
TERMS_OF_SERVICE_EFFECTIVE_DATE = "2026-07-23"

# Optional e-mail confirmation dispatch via Resend.
# RESEND_API_KEY should normally be configured as a secret, not here.
EMAIL_FROM = "cfwdon <noreply@fedi.manji.app>"
# Protected routes validate Auth0-issued RS256 JWTs.
# These Auth0 identifiers are configuration values, not secrets. Keep secret
# Auth0 values, API keys, and private key material outside git.
AUTH0_JWT_HEADER = "Authorization"
AUTH0_DOMAIN = "auth.manji.app"
AUTH0_CLIENT_ID = "6rUFgYfL4yxUBAGBogpStU4ZUfBlv9p6"
AUTH0_AUDIENCE = "https://fedi.manji.app"
AUTH0_EMAIL_CLAIM = "https://fedi.manji.app/claims/email"

# Configure these before the first real deploy. The binding names must stay
# in sync with crates/cfwdon-core/src/config.rs and the worker runtime code.
[[d1_databases]]
binding = "DB"
database_name = "cfwdon"
database_id = "69ce1fde-3bda-454e-8b30-f5bfa71e6212"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "cfwdon-media"

# Host-level DoH SSRF validation cache for remote ActivityPub fetches.
[[kv_namespaces]]
binding = "REMOTE_DNS_CACHE"
id = "c59e0ba7e3014e988aa5ab9c1f445d96"
preview_id = "da4dab37aa38485bb86f27649111445d"

# Configure the bucket behind a public custom domain and keep that domain
# outside protected API authentication. Entity payloads will use MEDIA_PUBLIC_BASE_URL
# directly; /media/:id remains as a fallback/redirect route.

[[queues.producers]]
binding = "OUTBOX_PROCESS_QUEUE"
queue = "cfwdon-outbox-process"

[[queues.consumers]]
queue = "cfwdon-outbox-process"
max_batch_size = 10
max_batch_timeout = 0
max_retries = 3
max_concurrency = 1

[[durable_objects.bindings]]
name = "STREAM_HUB"
class_name = "StreamHub"

[[durable_objects.bindings]]
name = "INBOX_HOST"
class_name = "InboxHost"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StreamHub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["InboxHost"]
